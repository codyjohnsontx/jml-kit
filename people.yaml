# people.yaml - the source of truth for who works at Pedalworks and what they can reach.
# Edit by pull request. `jml validate` checks this file on every PR.
#
# id is the identity: lowercase, never reused, and the local part of the Okta login.
# To offboard someone, set status: leaver with an end date. Remove a block only after
# the person is listed in people.archive.yaml.
#
# github is optional. Only the owner's account and one machine account have one; everyone
# else is Okta only, because each real person may hold just one free GitHub account.
company: pedalworks

seats:
  limit: 10     # active users on Okta's Integrator Free Plan
  reserved: 1   # the owner's super admin user, which this file does not manage

people:
